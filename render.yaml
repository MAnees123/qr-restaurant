services:
  - type: web
    name: laravel-app
    env: php
    plan: free

    buildCommand: |
      composer install
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache

    startCommand: php artisan serve --host 0.0.0.0 --port 10000
