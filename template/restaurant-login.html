<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restaurant System – Login</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background ── */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    /* Main warm restaurant background using CSS art */
    .bg-scene canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .bg-scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,0,0,0.38) 0%, rgba(20,10,5,0.28) 100%);
      z-index: 1;
    }

    /* ── Glassmorphism Card ── */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      /* True glass: very low opacity white so background bleeds through */
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(28px) saturate(1.8) brightness(1.08);
      -webkit-backdrop-filter: blur(28px) saturate(1.8) brightness(1.08);
      border-radius: 28px;
      padding: 48px 44px 40px;
      /* Multi-layer glow border */
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow:
        0 0 0 1px rgba(255,180,80,0.10),
        0 8px 32px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -1px 0 rgba(255,255,255,0.08);
      animation: slideUp 0.65s cubic-bezier(0.22,1,0.36,1) both;
      /* Subtle top-left glare streak */
      overflow: hidden;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 260px; height: 180px;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 60%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .glass-card > * { position: relative; z-index: 1; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Logo Icon ── */
    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42 0%, #e6450f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 6px 20px rgba(230,69,15,0.45);
      animation: popIn 0.7s 0.25s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.5); }
      to   { opacity:1; transform: scale(1); }
    }
    .logo-wrap i { font-size: 30px; color: #fff; }

    /* ── Title ── */
    .title-main {
      font-size: 2.1rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(90deg, #ff6b35 20%, #ffd166 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      letter-spacing: -0.5px;
      filter: drop-shadow(0 2px 12px rgba(255,140,50,0.35));
    }
    .subtitle {
      color: rgba(255,255,255,0.65);
      font-size: 0.93rem;
      font-weight: 400;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    /* ── Select Role ── */
    .role-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.70);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      display: block;
    }
    .role-selector {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      user-select: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 8px rgba(0,0,0,0.18);
    }
    .role-selector:hover {
      border-color: rgba(255,160,60,0.55);
      background: rgba(255,255,255,0.13);
      box-shadow: 0 0 0 3px rgba(255,140,50,0.12), inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .role-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg,#e63911,#f5a623);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(230,69,15,0.4);
    }
    .role-avatar i { font-size: 16px; color:#fff; }
    .role-text { flex: 1; }
    .role-name  { font-weight: 700; font-size: 0.93rem; color: rgba(255,255,255,0.95); line-height: 1.2; }
    .role-desc  { font-size: 0.76rem; color: rgba(255,255,255,0.50); }
    .role-caret { color: rgba(255,255,255,0.50); font-size: 1rem; }

    /* Dropdown */
    .role-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0; right: 0;
      background: rgba(20,12,6,0.75);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .role-dropdown.open { display: block; animation: fadeDown 0.22s ease; }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    .role-option {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px;
      cursor: pointer; transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .role-option:last-child { border-bottom: none; }
    .role-option:hover { background: rgba(255,255,255,0.10); }
    .role-option.active { background: rgba(255,140,50,0.14); }
    .role-option .role-name  { color: rgba(255,255,255,0.92); }
    .role-option .role-desc  { color: rgba(255,255,255,0.45); }

    /* ── Floating Label Inputs ── */
    .input-group-float {
      position: relative;
      margin-top: 20px;
    }
    .input-group-float input {
      width: 100%;
      padding: 18px 48px 8px 48px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.95);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      appearance: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 8px rgba(0,0,0,0.18);
    }
    .input-group-float input::placeholder { color: transparent; }
    .input-group-float input:focus {
      border-color: rgba(255,160,60,0.65);
      box-shadow: 0 0 0 3.5px rgba(255,140,50,0.18), inset 0 1px 0 rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.13);
    }
    .input-group-float label {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.88rem;
      color: rgba(255,255,255,0.50);
      pointer-events: none;
      transition: all 0.2s ease;
      background: transparent;
    }
    .input-group-float input:focus ~ label,
    .input-group-float input:not(:placeholder-shown) ~ label {
      top: 10px;
      transform: translateY(0);
      font-size: 0.68rem;
      font-weight: 600;
      color: rgba(255,180,80,0.95);
      letter-spacing: 0.2px;
    }
    .input-group-float .required-star { color: #ff6b35; }

    .input-icon-left {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1.05rem; color: rgba(255,160,60,0.85);
      pointer-events: none;
    }
    .input-icon-right {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.45);
      cursor: pointer; transition: color 0.2s;
      background: none; border: none;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .input-icon-right:hover { color: rgba(255,180,80,0.95); }

    /* ── Forgot ── */
    .forgot-link {
      display: block; text-align: right;
      color: rgba(255,180,80,0.85); font-size: 0.82rem; font-weight: 600;
      text-decoration: none; margin-top: 10px;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: #ff6b35; }

    /* ── Submit Button ── */
    .btn-login {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 26px;
      padding: 14px;
      border: none; border-radius: 14px;
      background: linear-gradient(90deg, #e63911 0%, #f5a623 100%);
      color: #fff; font-family: 'Poppins', sans-serif;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(230,57,17,0.45), 0 1px 0 rgba(255,255,255,0.15) inset;
      transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
      position: relative; overflow: hidden;
    }
    .btn-login::before {
      content:''; position:absolute; inset:0;
      background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.22) 50%,transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.45s ease;
    }
    .btn-login:hover::before { transform: translateX(100%); }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(230,57,17,0.50); }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading i { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider / Register ── */
    .divider { display:flex; align-items:center; gap:10px; margin-top:22px; }
    .divider hr { flex:1; border:none; border-top:1px solid rgba(255,255,255,0.15); }
    .divider span { font-size:0.78rem; color:rgba(255,255,255,0.40); white-space: nowrap; }

    .register-row { text-align:center; margin-top:14px; font-size:0.84rem; color:rgba(255,255,255,0.45); }
    .register-row a { color:rgba(255,180,80,0.90); font-weight:600; text-decoration:none; }
    .register-row a:hover { color: #ff6b35; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 28px; right: 28px; z-index: 9999;
      background: #111827; color: #fff;
      border-radius: 10px; padding: 12px 20px;
      font-size: 0.85rem; font-family: 'Poppins',sans-serif;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      display:none; animation: toastIn 0.3s ease;
    }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    #toast.error  { border-left: 4px solid #e63911; }
    #toast.success{ border-left: 4px solid #22c55e; }

    /* ── Responsive ── */
    @media(max-width:540px){
      .glass-card { padding:36px 22px 30px; border-radius:18px; }
      .title-main { font-size:1.7rem; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-scene">
    <canvas id="bgCanvas"></canvas>
  </div>

  <!-- Glassmorphism Card -->
  <div class="glass-card mx-3">

    <!-- Logo -->
    <div class="logo-wrap">
      <i class="bi bi-egg-fried"></i>
    </div>

    <!-- Title -->
    <h1 class="title-main">Restaurant System</h1>
    <p class="subtitle">Welcome back! Please sign in to continue</p>

    <!-- Role Selector -->
    <div style="position:relative;">
      <span class="role-label">Select Role</span>
      <div class="role-selector" id="roleSelector" onclick="toggleDropdown()">
        <div class="role-avatar"><i class="bi bi-shield-fill" id="roleIcon"></i></div>
        <div class="role-text">
          <div class="role-name" id="roleName">Super Admin</div>
          <div class="role-desc" id="roleDesc">Full system access</div>
        </div>
        <i class="bi bi-chevron-down role-caret" id="roleCaret"></i>
      </div>

      <div class="role-dropdown" id="roleDropdown">
        <div class="role-option active" onclick="selectRole(this,'Super Admin','Full system access','shield-fill')">
          <div class="role-avatar"><i class="bi bi-shield-fill"></i></div>
          <div class="role-text"><div class="role-name">Super Admin</div><div class="role-desc">Full system access</div></div>
        </div>
        <div class="role-option" onclick="selectRole(this,'Manager','Manage orders & staff','person-workspace')">
          <div class="role-avatar" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)"><i class="bi bi-person-workspace"></i></div>
          <div class="role-text"><div class="role-name">Manager</div><div class="role-desc">Manage orders & staff</div></div>
        </div>
        <div class="role-option" onclick="selectRole(this,'Waiter','Table & order handling','person-badge')">
          <div class="role-avatar" style="background:linear-gradient(135deg,#0ea5e9,#0284c7)"><i class="bi bi-person-badge"></i></div>
          <div class="role-text"><div class="role-name">Waiter</div><div class="role-desc">Table & order handling</div></div>
        </div>
        <div class="role-option" onclick="selectRole(this,'Chef','Kitchen management','fire')">
          <div class="role-avatar" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><i class="bi bi-fire"></i></div>
          <div class="role-text"><div class="role-name">Chef</div><div class="role-desc">Kitchen management</div></div>
        </div>
      </div>
    </div>

    <!-- Email -->
    <div class="input-group-float">
      <i class="bi bi-envelope-fill input-icon-left"></i>
      <input type="email" id="email" placeholder=" " autocomplete="email"/>
      <label for="email">Email Address <span class="required-star">*</span></label>
    </div>

    <!-- Password -->
    <div class="input-group-float">
      <i class="bi bi-lock-fill input-icon-left"></i>
      <input type="password" id="password" placeholder=" " autocomplete="current-password"/>
      <label for="password">Password <span class="required-star">*</span></label>
      <button class="input-icon-right" type="button" onclick="togglePassword()" id="eyeBtn" title="Toggle password">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <!-- Forgot -->
    <a href="#" class="forgot-link" onclick="showToast('Password reset link sent to your email!','success'); return false;">
      Forgot Password?
    </a>

    <!-- Login Button -->
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <i class="bi bi-box-arrow-in-right" id="loginIcon"></i>
      <span id="loginText">Sign In</span>
    </button>

    <!-- Divider -->
    <div class="divider">
      <hr/><span>Don't have an account?</span><hr/>
    </div>

    <div class="register-row">
      <a href="#" onclick="showToast('Contact your system administrator to register.','success'); return false;">
        Register here
      </a>
    </div>

  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ── Role Dropdown ── */
    const iconColors = {
      'shield-fill': 'linear-gradient(135deg,#e63911,#f5a623)',
      'person-workspace': 'linear-gradient(135deg,#4f46e5,#7c3aed)',
      'person-badge': 'linear-gradient(135deg,#0ea5e9,#0284c7)',
      'fire': 'linear-gradient(135deg,#f59e0b,#d97706)',
    };

    function toggleDropdown() {
      const dd = document.getElementById('roleDropdown');
      const caret = document.getElementById('roleCaret');
      const open = dd.classList.toggle('open');
      caret.style.transform = open ? 'rotate(180deg)' : '';
      caret.style.transition = 'transform 0.25s';
    }

    function selectRole(el, name, desc, icon) {
      document.getElementById('roleName').textContent = name;
      document.getElementById('roleDesc').textContent = desc;
      const ico = document.getElementById('roleIcon');
      ico.className = 'bi bi-' + icon;
      ico.closest('.role-avatar').style.background = iconColors[icon] || iconColors['shield-fill'];
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      toggleDropdown();
    }

    document.addEventListener('click', e => {
      if (!document.getElementById('roleSelector').contains(e.target) &&
          !document.getElementById('roleDropdown').contains(e.target)) {
        document.getElementById('roleDropdown').classList.remove('open');
        document.getElementById('roleCaret').style.transform = '';
      }
    });

    /* ── Password Toggle ── */
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>`;
      }
    }

    /* ── Login Handler ── */
    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      const btn   = document.getElementById('loginBtn');
      const ico   = document.getElementById('loginIcon');
      const txt   = document.getElementById('loginText');

      if (!email) { showToast('Please enter your email address.', 'error'); shakeFocus('email'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email.', 'error'); shakeFocus('email'); return; }
      if (!pass)  { showToast('Please enter your password.', 'error'); shakeFocus('password'); return; }
      if (pass.length < 6) { showToast('Password must be at least 6 characters.', 'error'); shakeFocus('password'); return; }

      // Loading state
      btn.disabled = true;
      ico.className = 'bi bi-arrow-repeat';
      txt.textContent = 'Signing in…';
      btn.classList.add('loading');

      setTimeout(() => {
        btn.disabled = false;
        ico.className = 'bi bi-box-arrow-in-right';
        txt.textContent = 'Sign In';
        btn.classList.remove('loading');
        showToast('✓ Signed in successfully! Redirecting…', 'success');
      }, 1800);
    }

    /* ── Shake helper ── */
    function shakeFocus(id) {
      const el = document.getElementById(id);
      el.focus();
      el.closest('.input-group-float').animate([
        {transform:'translateX(-6px)'},{transform:'translateX(6px)'},
        {transform:'translateX(-4px)'},{transform:'translateX(4px)'},
        {transform:'translateX(0)'}
      ], { duration: 350, easing: 'ease-in-out' });
    }

    /* ── Toast ── */
    let toastTimer;
    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = type;
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    /* ── Enter key ── */
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    /* ── Canvas Restaurant Background ── */
    (function drawBg() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
      }

      function draw() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Sky / ceiling gradient - warm amber dusk outside windows
        const sky = ctx.createLinearGradient(0, 0, W, H * 0.55);
        sky.addColorStop(0,   '#1a0a05');
        sky.addColorStop(0.25,'#3d1a06');
        sky.addColorStop(0.5, '#7a3810');
        sky.addColorStop(0.75,'#c4681a');
        sky.addColorStop(1,   '#e8972a');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H * 0.55);

        // Floor gradient - deep rich brown
        const floor = ctx.createLinearGradient(0, H * 0.5, 0, H);
        floor.addColorStop(0, '#2a1205');
        floor.addColorStop(1, '#0d0601');
        ctx.fillStyle = floor;
        ctx.fillRect(0, H * 0.5, W, H * 0.5);

        // ── Window glow (left side - cityscape) ──
        const winL = ctx.createRadialGradient(W * 0.12, H * 0.3, 10, W * 0.12, H * 0.3, W * 0.28);
        winL.addColorStop(0,   'rgba(255,180,60,0.55)');
        winL.addColorStop(0.4, 'rgba(220,120,30,0.25)');
        winL.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = winL;
        ctx.fillRect(0, 0, W * 0.35, H * 0.7);

        // ── Window glow (right side) ──
        const winR = ctx.createRadialGradient(W * 0.88, H * 0.28, 10, W * 0.88, H * 0.28, W * 0.3);
        winR.addColorStop(0,   'rgba(180,220,255,0.35)');
        winR.addColorStop(0.4, 'rgba(100,160,210,0.18)');
        winR.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = winR;
        ctx.fillRect(W * 0.65, 0, W * 0.35, H * 0.65);

        // ── City lights in distance (small dots) ──
        ctx.save();
        for (let i = 0; i < 120; i++) {
          const x = (Math.sin(i * 137.5) * 0.5 + 0.5) * W;
          const y = (Math.cos(i * 97.3)  * 0.5 + 0.5) * H * 0.5;
          const r = Math.random() * 1.8 + 0.4;
          const alpha = Math.random() * 0.7 + 0.3;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,${180 + Math.floor(Math.random()*75)},${80 + Math.floor(Math.random()*80)},${alpha})`;
          ctx.fill();
        }
        ctx.restore();

        // ── Columns / pillars ──
        function pillar(x, w) {
          const g = ctx.createLinearGradient(x, 0, x + w, 0);
          g.addColorStop(0,   'rgba(60,25,5,0.9)');
          g.addColorStop(0.3, 'rgba(100,45,10,0.7)');
          g.addColorStop(0.7, 'rgba(80,35,8,0.75)');
          g.addColorStop(1,   'rgba(30,12,2,0.95)');
          ctx.fillStyle = g;
          ctx.fillRect(x, 0, w, H);
        }
        pillar(W * 0.0,  W * 0.055);
        pillar(W * 0.24, W * 0.045);
        pillar(W * 0.72, W * 0.045);
        pillar(W * 0.945,W * 0.055);

        // ── Dining tables ──
        function table(cx, cy, rx, ry) {
          const tg = ctx.createRadialGradient(cx, cy - ry*0.3, 2, cx, cy, rx);
          tg.addColorStop(0,   'rgba(180,90,20,0.9)');
          tg.addColorStop(0.5, 'rgba(120,55,10,0.8)');
          tg.addColorStop(1,   'rgba(60,25,5,0.6)');
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.fillStyle = tg;
          ctx.fill();

          // Table cloth highlight
          ctx.beginPath();
          ctx.ellipse(cx, cy - ry * 0.15, rx * 0.7, ry * 0.35, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,220,160,0.12)';
          ctx.fill();
        }
        table(W * 0.13, H * 0.72, W * 0.09, H * 0.04);
        table(W * 0.35, H * 0.78, W * 0.10, H * 0.04);
        table(W * 0.65, H * 0.76, W * 0.10, H * 0.04);
        table(W * 0.87, H * 0.70, W * 0.09, H * 0.04);

        // ── Candle / table lamp glows ──
        function candleGlow(cx, cy, spread) {
          const cg = ctx.createRadialGradient(cx, cy, 1, cx, cy, spread);
          cg.addColorStop(0,   'rgba(255,210,80,0.75)');
          cg.addColorStop(0.3, 'rgba(255,150,30,0.35)');
          cg.addColorStop(1,   'rgba(255,100,0,0)');
          ctx.beginPath();
          ctx.arc(cx, cy, spread, 0, Math.PI * 2);
          ctx.fillStyle = cg;
          ctx.fill();
        }
        candleGlow(W*0.13, H*0.68, W*0.07);
        candleGlow(W*0.35, H*0.73, W*0.07);
        candleGlow(W*0.65, H*0.71, W*0.07);
        candleGlow(W*0.87, H*0.66, W*0.07);

        // ── Chairs (simple arcs) ──
        function chair(cx, cy, size) {
          ctx.save();
          ctx.strokeStyle = 'rgba(80,35,8,0.85)';
          ctx.lineWidth = size * 0.18;
          ctx.beginPath();
          ctx.arc(cx, cy, size, Math.PI * 0.1, Math.PI * 0.9);
          ctx.stroke();
          ctx.restore();
        }
        chair(W*0.09, H*0.71, H*0.045);
        chair(W*0.17, H*0.71, H*0.045);
        chair(W*0.30, H*0.77, H*0.048);
        chair(W*0.40, H*0.77, H*0.048);
        chair(W*0.60, H*0.75, H*0.048);
        chair(W*0.70, H*0.75, H*0.048);
        chair(W*0.83, H*0.69, H*0.045);
        chair(W*0.91, H*0.69, H*0.045);

        // ── Overhead warm pendant lights ──
        function pendant(x, intensity) {
          const pg = ctx.createRadialGradient(x, H*0.08, 2, x, H*0.2, H*0.25);
          pg.addColorStop(0,   `rgba(255,200,80,${intensity})`);
          pg.addColorStop(0.35,`rgba(230,140,30,${intensity*0.4})`);
          pg.addColorStop(1,   'rgba(0,0,0,0)');
          ctx.beginPath();
          ctx.arc(x, H*0.08, H*0.25, 0, Math.PI*2);
          ctx.fillStyle = pg;
          ctx.fill();
          // Bulb
          ctx.beginPath();
          ctx.arc(x, H*0.085, 5, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,240,180,0.95)';
          ctx.fill();
        }
        pendant(W*0.2,  0.28);
        pendant(W*0.5,  0.32);
        pendant(W*0.8,  0.28);

        // ── Wine glasses on tables (simple line art) ──
        function glass_(cx, cy, h) {
          ctx.save();
          ctx.strokeStyle = 'rgba(220,180,120,0.55)';
          ctx.lineWidth = 1.2;
          // bowl
          ctx.beginPath();
          ctx.ellipse(cx, cy, h*0.18, h*0.1, 0, 0, Math.PI*2);
          ctx.stroke();
          // stem
          ctx.beginPath();
          ctx.moveTo(cx, cy + h*0.1);
          ctx.lineTo(cx, cy + h*0.38);
          ctx.stroke();
          // base
          ctx.beginPath();
          ctx.moveTo(cx - h*0.15, cy + h*0.38);
          ctx.lineTo(cx + h*0.15, cy + h*0.38);
          ctx.stroke();
          ctx.restore();
        }
        glass_(W*0.11, H*0.665, 28);
        glass_(W*0.155,H*0.665, 28);
        glass_(W*0.33, H*0.725, 30);
        glass_(W*0.37, H*0.725, 30);
        glass_(W*0.63, H*0.705, 30);
        glass_(W*0.67, H*0.705, 30);
        glass_(W*0.855,H*0.645, 28);
        glass_(W*0.895,H*0.645, 28);

        // ── Atmospheric vignette ──
        const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.9);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.72)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);

        // ── Subtle warm floor reflection ──
        const refl = ctx.createLinearGradient(0, H*0.6, 0, H);
        refl.addColorStop(0, 'rgba(180,80,10,0.08)');
        refl.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = refl;
        ctx.fillRect(0, H*0.6, W, H*0.4);
      }

      resize();
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
