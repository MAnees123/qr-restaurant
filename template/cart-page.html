<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Cart - Food Ordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .phone-shell {
      width: 390px;
      min-height: 100vh;
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }
    .phone-shell::-webkit-scrollbar { display: none; }

    /* ── Header ── */
    .app-header {
      padding: 20px 18px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1c;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: #e8890c;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      padding: 0;
      min-width: 60px;
    }
    .back-btn i { font-size: 12px; }

    .page-title {
      font-family: 'Dancing Script', cursive;
      font-size: 24px;
      color: #fff;
      font-weight: 700;
    }

    .cart-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      min-width: 60px;
      text-align: right;
    }

    /* ── My Order Section ── */
    .section-wrap {
      padding: 6px 18px 0;
    }

    .my-order-title {
      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      color: #fff;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* ── Cart Item Card ── */
    .cart-item-card {
      background: #252525;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .cart-item-img {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .bg-mung  { background: linear-gradient(135deg, #1a1a0e, #2e2e1a); }
    .bg-steak { background: linear-gradient(135deg, #1a0d00, #2e1800); }

    .cart-item-info {
      flex: 1;
    }
    .cart-item-name {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .cart-item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cart-item-price {
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      transition: transform 0.1s;
    }
    .qty-btn.minus { color: #e8890c; }
    .qty-btn.plus  { color: #e8890c; }
    .qty-btn:active { transform: scale(0.85); }
    .qty-num {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    /* ── Promo Code ── */
    .promo-wrap {
      margin: 22px 18px 0;
      background: #252525;
      border-radius: 14px;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 4px 4px 4px 16px;
    }
    .promo-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #aaa;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      padding: 10px 0;
    }
    .promo-input::placeholder { color: #666; }
    .promo-apply-btn {
      background: #c0441a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }
    .promo-apply-btn:hover { background: #e8890c; }
    .promo-apply-btn:active { transform: scale(0.97); }

    /* ── Order Summary ── */
    .summary-wrap {
      margin: 22px 18px 0;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .summary-label {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .summary-value {
      color: #fff;
      font-size: 14px;
      font-weight: 500;
    }
    .summary-row.total-payment .summary-label {
      font-weight: 700;
      font-size: 15px;
    }
    .summary-row.total-payment .summary-value {
      font-weight: 700;
      font-size: 15px;
    }
    .summary-items-note {
      color: #888;
      font-size: 11px;
      font-weight: 400;
      margin-right: 5px;
    }

    /* ── Checkout Button ── */
    .checkout-wrap {
      padding: 20px 18px 24px;
      margin-top: auto;
    }
    .checkout-btn {
      width: 100%;
      background: #c0441a;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }
    .checkout-btn:hover { background: #e8890c; }
    .checkout-btn:active { transform: scale(0.98); }

    /* ── Toast ── */
    .toast-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #e8890c;
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* divider line */
    .summary-divider {
      border: none;
      border-top: 1px solid #2e2e2e;
      margin: 4px 0 14px;
    }
  </style>
</head>
<body>

<div class="phone-shell" id="app">

  <!-- Header -->
  <div class="app-header">
    <button class="back-btn">
      <i class="fas fa-play fa-flip-horizontal"></i> Back
    </button>
    <span class="page-title">Cart</span>
    <div style="min-width:60px;text-align:right;">
      <button class="cart-btn"><i class="fas fa-shopping-cart"></i></button>
    </div>
  </div>

  <!-- My Order -->
  <div class="section-wrap">
    <div class="my-order-title">My Order</div>

    <!-- Item 1 -->
    <div class="cart-item-card">
      <div class="cart-item-img bg-mung">🍨</div>
      <div class="cart-item-info">
        <div class="cart-item-name">Mung Bean Dessert<br>with Grape Flavor</div>
        <div class="cart-item-bottom">
          <span class="cart-item-price">$ 1,234.56</span>
          <div class="qty-controls">
            <button class="qty-btn minus" onclick="changeQty('qty1', -1)">−</button>
            <span class="qty-num" id="qty1">3</span>
            <button class="qty-btn plus" onclick="changeQty('qty1', 1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="cart-item-card">
      <div class="cart-item-img bg-steak">🥩</div>
      <div class="cart-item-info">
        <div class="cart-item-name">Chicken Steak<br>with French Fires</div>
        <div class="cart-item-bottom">
          <span class="cart-item-price">$ 1,234.56</span>
          <div class="qty-controls">
            <button class="qty-btn minus" onclick="changeQty('qty2', -1)">−</button>
            <span class="qty-num" id="qty2">2</span>
            <button class="qty-btn plus" onclick="changeQty('qty2', 1)">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Promo Code -->
  <div class="promo-wrap">
    <input class="promo-input" type="text" placeholder="Promo Code..." id="promoInput" />
    <button class="promo-apply-btn" onclick="applyPromo()">Apply</button>
  </div>

  <!-- Order Summary -->
  <div class="summary-wrap">
    <div class="summary-row">
      <span class="summary-label">Total Order</span>
      <span class="summary-value" id="totalOrder">$ 6,172.80</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Tax</span>
      <span class="summary-value" id="taxAmt">$ 617.28</span>
    </div>
    <hr class="summary-divider"/>
    <div class="summary-row total-payment">
      <span class="summary-label">Total Payment</span>
      <span class="summary-value">
        <span class="summary-items-note" id="itemsNote">(5 items)</span>
        <span id="totalPayment">$ 6,790.08</span>
      </span>
    </div>
  </div>

  <!-- Checkout Button -->
  <div class="checkout-wrap">
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
  </div>

</div>

<!-- Toast -->
<div class="toast-msg" id="toast"></div>

<script>
  const UNIT_PRICE = 1234.56;
  const TAX_RATE   = 0.10;

  function getQty(id) {
    return parseInt(document.getElementById(id).textContent);
  }

  function changeQty(id, delta) {
    const el  = document.getElementById(id);
    let val = parseInt(el.textContent) + delta;
    if (val < 1) val = 1;
    el.textContent = val;
    recalc();
  }

  function recalc() {
    const q1 = getQty('qty1');
    const q2 = getQty('qty2');
    const total = (q1 + q2) * UNIT_PRICE;
    const tax   = total * TAX_RATE;
    const pay   = total + tax;
    const items = q1 + q2;

    document.getElementById('totalOrder').textContent  = '$ ' + total.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    document.getElementById('taxAmt').textContent      = '$ ' + tax.toLocaleString('en-US',   {minimumFractionDigits:2, maximumFractionDigits:2});
    document.getElementById('totalPayment').textContent= '$ ' + pay.toLocaleString('en-US',   {minimumFractionDigits:2, maximumFractionDigits:2});
    document.getElementById('itemsNote').textContent   = '(' + items + ' item' + (items !== 1 ? 's' : '') + ')';
  }

  function applyPromo() {
    const code = document.getElementById('promoInput').value.trim();
    showToast(code ? '🎉 Promo "' + code + '" applied!' : 'Please enter a promo code.');
  }

  function checkout() {
    showToast('✅ Order placed successfully!');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
