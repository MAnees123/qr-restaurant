<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Dessert - Food Ordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .phone-shell {
      width: 390px;
      min-height: 100vh;
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .phone-shell::-webkit-scrollbar { display: none; }

    /* ── Header ── */
    .app-header {
      padding: 18px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1c;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: #e8890c;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      padding: 0;
    }
    .back-btn i { font-size: 13px; }

    .page-title {
      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .cart-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      position: relative;
    }
    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e8890c;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Search ── */
    .search-wrap {
      padding: 0 18px 16px;
      background: #1c1c1c;
    }
    .search-box {
      background: #2a2a2a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 11px 14px;
      gap: 8px;
      border: 1px solid #333;
    }
    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: #888;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      width: 100%;
    }
    .search-box input::placeholder { color: #555; }
    .search-box i { color: #666; font-size: 14px; }

    /* ── Item List ── */
    .item-list {
      padding: 4px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .food-item-card {
      background: #252525;
      border-radius: 16px;
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow: hidden;
      transition: transform 0.15s ease;
    }
    .food-item-card:active { transform: scale(0.98); }

    .food-item-img {
      width: 110px;
      min-height: 120px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .food-item-img .emoji-placeholder {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
    }

    .food-item-body {
      flex: 1;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .food-item-name {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .food-item-price {
      color: #aaa;
      font-size: 12px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .add-cart-btn {
      background: #c0441a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    .add-cart-btn:hover { background: #e8890c; }
    .add-cart-btn:active { transform: scale(0.96); background: #e8890c; }

    /* item bg colors */
    .bg-1 { background: linear-gradient(135deg, #1a1a0e, #2a2a18); }
    .bg-2 { background: linear-gradient(135deg, #1a0a0a, #2a1212); }
    .bg-3 { background: linear-gradient(135deg, #120c06, #221a10); }
    .bg-4 { background: linear-gradient(135deg, #1a1206, #2a1e0a); }

    /* ── Bottom Nav ── */
    .bottom-nav {
      margin-top: auto;
      background: #1c1c1c;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 18px;
      position: sticky;
      bottom: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-item i { font-size: 20px; color: #444; }
    .nav-item.active i { color: #e8890c; }
    .nav-dot { width: 5px; height: 5px; background: #e8890c; border-radius: 50%; }

    /* toast */
    .toast-msg {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #e8890c;
      color: #fff;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="phone-shell">

  <!-- Header -->
  <div class="app-header">
    <button class="back-btn" onclick="history.back()">
      <i class="fas fa-play fa-flip-horizontal"></i> Back
    </button>
    <span class="page-title">Dessert</span>
    <button class="cart-btn">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-badge" id="cartCount">0</span>
    </button>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" placeholder="Search menu" id="searchInput" oninput="filterItems()" />
      <i class="fas fa-search"></i>
    </div>
  </div>

  <!-- Item List -->
  <div class="item-list" id="itemList">

    <!-- Item 1 -->
    <div class="food-item-card" data-name="mung bean dessert with grape flavor">
      <div class="food-item-img">
        <div class="emoji-placeholder bg-1">🍨</div>
      </div>
      <div class="food-item-body">
        <div>
          <div class="food-item-name">Mung Bean Dessert<br>with Grape Flavor</div>
          <div class="food-item-price">$ 1,234.56</div>
        </div>
        <button class="add-cart-btn" onclick="addToCart(this)">add to cart</button>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="food-item-card" data-name="strawberry dessert with milk">
      <div class="food-item-img">
        <div class="emoji-placeholder bg-2">🍓</div>
      </div>
      <div class="food-item-body">
        <div>
          <div class="food-item-name">Strawberry Dessert<br>with Milk</div>
          <div class="food-item-price">$ 1,234.56</div>
        </div>
        <button class="add-cart-btn" onclick="addToCart(this)">add to cart</button>
      </div>
    </div>

    <!-- Item 3 -->
    <div class="food-item-card" data-name="pudding coffee latte brown sugar">
      <div class="food-item-img">
        <div class="emoji-placeholder bg-3">☕</div>
      </div>
      <div class="food-item-body">
        <div>
          <div class="food-item-name">Pudding Coffee latte<br>Brown Sugar</div>
          <div class="food-item-price">$ 1,234.56</div>
        </div>
        <button class="add-cart-btn" onclick="addToCart(this)">add to cart</button>
      </div>
    </div>

    <!-- Item 4 -->
    <div class="food-item-card" data-name="dessert coffee with mango and cream">
      <div class="food-item-img">
        <div class="emoji-placeholder bg-4">🥭</div>
      </div>
      <div class="food-item-body">
        <div>
          <div class="food-item-name">Dessert Coffee with<br>Mango and Cream</div>
          <div class="food-item-price">$ 1,234.56</div>
        </div>
        <button class="add-cart-btn" onclick="addToCart(this)">add to cart</button>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item" onclick="setNav(this)">
      <i class="fas fa-home"></i>
    </button>
    <button class="nav-item" onclick="setNav(this)">
      <i class="fas fa-search"></i>
    </button>
    <button class="nav-item active" onclick="setNav(this)">
      <i class="fas fa-utensils"></i>
      <div class="nav-dot"></div>
    </button>
    <button class="nav-item" onclick="setNav(this)">
      <i class="fas fa-user"></i>
    </button>
  </div>

</div>

<!-- Toast -->
<div class="toast-msg" id="toast">Added to cart! 🛒</div>

<script>
  let cartCount = 0;

  function addToCart(btn) {
    cartCount++;
    document.getElementById('cartCount').textContent = cartCount;

    // button feedback
    const orig = btn.textContent;
    btn.textContent = '✓ Added!';
    btn.style.background = '#e8890c';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
    }, 1200);

    // toast
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function setNav(el) {
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.remove('active');
      const dot = n.querySelector('.nav-dot');
      if (dot) dot.remove();
    });
    el.classList.add('active');
    const dot = document.createElement('div');
    dot.className = 'nav-dot';
    el.appendChild(dot);
  }

  function filterItems() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.food-item-card').forEach(card => {
      const name = card.dataset.name || '';
      card.style.display = name.includes(q) ? '' : 'none';
    });
  }
</script>
</body>
</html>
